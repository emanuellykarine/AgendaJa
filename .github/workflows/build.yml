name: Build AgendeJá

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build do projeto (Python + Java)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Auditar bibliotecas Python
        run: pip-audit -r requirements.txt

      - name: Verificar padrão de codificação PEP 8
        run: ruff check agendeja_rest gateway chat_tcp_udp

      - name: Detectar código duplicado
        run: pylint --disable=all --enable=duplicate-code agendeja_rest/agendeja_rest agendeja_rest/servicos gateway chat_tcp_udp

      - name: Detectar code smells
        run: pylint --disable=all --enable=broad-exception-caught,missing-timeout,unused-argument,wrong-import-order agendeja_rest/agendeja_rest agendeja_rest/servicos gateway

      - name: Detectar falhas de segurança no código Python (Bandit)
        run: bandit -r agendeja_rest gateway chat_tcp_udp -x agendeja_rest/servicos/migrations

      - name: Instalar Semgrep
        if: ${{ !cancelled() }}
        run: pipx install semgrep==1.185.0

      - name: Detectar bugs e falhas de segurança (Semgrep)
        if: ${{ !cancelled() }}
        run: >-
          semgrep scan --error --metrics=off
          --config p/python --config p/django --config p/javascript
          --config p/dockerfile --config p/github-actions --config p/secrets

      - name: Detectar depreciações Python em runtime
        run: python -W error::DeprecationWarning -m pytest

      - name: Detectar depreciação do Gateway
        run: python -W error::DeprecationWarning -c "import sys; sys.path.insert(0, 'gateway'); import main"

      - name: Configurar JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Checar sintaxe dos módulos Python
        run: python -m compileall -q agendeja_rest gateway chat_tcp_udp

      - name: Validar projeto Django
        working-directory: agendeja_rest
        run: python manage.py check

      - name: Instalar Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Gerar diagrama de classes UML (domínio)
        working-directory: agendeja_rest
        run: |
          mkdir -p ../docs/uml
          pyreverse -o png -p AgendeJaDominio --output-directory ../docs/uml servicos.models

      - name: Publicar diagrama de classes UML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagrama-classes-uml
          path: docs/uml/classes_AgendeJaDominio.png

      - name: Compilar o servidor SOAP
        working-directory: soap
        run: javac -cp "lib/*" -d build src/com/agendeja/soap/*.java

      - name: Detectar APIs Java depreciadas
        working-directory: soap
        run: jdeprscan --class-path "lib/*:build" build

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit 
