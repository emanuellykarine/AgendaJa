name: Build AgendeJá

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build do projeto (Python + Java)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.9 pip-audit

      - name: Auditar bibliotecas Python
        run: pip-audit -r requirements.txt

      - name: Analisar arquivos Python
        run: ruff check --select UP005,UP019,UP023,UP026,UP035,UP051 agendeja_rest gateway chat_tcp_udp

      - name: Detectar depreciações Python em runtime
        run: python -W error::DeprecationWarning -m pytest

      - name: Detectar depreciação do Gateway
        run: python -W error::DeprecationWarning -c "import sys; sys.path.insert(0, 'gateway'); import main"

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Checar sintaxe dos módulos Python
        run: python -m compileall -q agendeja_rest gateway chat_tcp_udp

      - name: Validar projeto Django
        working-directory: agendeja_rest
        run: python manage.py check

      - name: Compilar o servidor SOAP
        working-directory: soap
        run: javac -cp "lib/*" -d build src/com/agendeja/soap/*.java

      - name: Detectar APIs Java depreciadas
        working-directory: soap
        run: jdeprscan --class-path "lib/*:build" build
